name: Build and Package

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., 1.0.0)'
        required: true
        default: '1.0.0'
  
  push:
    branches: [master, main]
    paths-ignore:
      - '**.md'
      - 'docs/**'

jobs:
  build-and-package:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8.12.0

      - name: Get version
        id: get_version
        run: |
          if [ "${{ github.event.inputs.version }}" != "" ]; then
            echo "VERSION=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "VERSION=$(date +%Y%m%d)-$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          fi

      - name: Install dependencies
        run: pnpm install

      - name: Build project
        run: pnpm build

      - name: Package for distribution
        run: node scripts/package-for-npm.js ${{ steps.get_version.outputs.VERSION }}


  build-binaries:
    needs: build-and-package
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: node18-linux-x64
            output: zotero-linux-x64
          - os: ubuntu-latest
            target: node18-linux-arm64
            output: zotero-linux-arm64
          - os: macos-latest
            target: node18-macos-x64
            output: zotero-macos-x64
          - os: macos-latest
            target: node18-macos-arm64
            output: zotero-macos-arm64
          - os: windows-latest
            target: node18-win-x64
            output: zotero-win-x64.exe
    runs-on: ${{ matrix.os }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8.12.0

      - name: Install dependencies
        run: pnpm install

      - name: Build project
        run: pnpm build

      - name: Bundle CLI
        run: |
          cd apps/cli-bundle
          pnpm install
          node bundle.js          

      - name: Build executable
        run: |
          cd apps/cli-bundle/dist
          npx pkg -t ${{ matrix.target }} --output ${{ matrix.output }} zotero.js          
