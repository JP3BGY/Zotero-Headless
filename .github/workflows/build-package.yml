name: Build and Package

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., 1.0.0)'
        required: true
        default: '1.0.0'
  
  push:
    branches: [master, main]
    paths-ignore:
      - '**.md'
      - 'docs/**'

jobs:
  build-and-package:
    runs-on: ubuntu-latest
    outputs:
      VERSION: ${{ steps.get_version.outputs.VERSION }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8.12.0

      - name: Get version
        id: get_version
        run: |
          if [ "${{ github.event.inputs.version }}" != "" ]; then
            echo "VERSION=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "VERSION=$(date +%Y%m%d)-$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          fi

      - name: Install dependencies
        run: pnpm install

      - name: Build project
        run: pnpm build

      - name: Package for distribution
        run: node scripts/package-for-npm.js ${{ steps.get_version.outputs.VERSION }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: zotero-headless-${{ steps.get_version.outputs.VERSION }}
          path: zotero-headless-*.tgz
          retention-days: 30

  build-binaries:
    needs: build-and-package
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: node18-linux-x64
            output: zotero-linux-x64
          - os: ubuntu-latest
            target: node18-linux-arm64
            output: zotero-linux-arm64
          - os: macos-latest
            target: node18-macos-x64
            output: zotero-macos-x64
          - os: macos-latest
            target: node18-macos-arm64
            output: zotero-macos-arm64
          - os: windows-latest
            target: node18-win-x64
            output: zotero-win-x64.exe
    runs-on: ${{ matrix.os }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8.12.0

      - name: Install dependencies
        run: pnpm install

      - name: Build project
        run: pnpm build

      - name: Bundle CLI
        run: |
          cd apps/cli-bundle
          pnpm install
          node bundle.js          

      - name: Build executable
        run: |
          cd apps/cli-bundle/dist
          npx pkg -t ${{ matrix.target }} --output ${{ matrix.output }} zotero.js          

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.output }}
          path: apps/cli-bundle/dist/${{ matrix.output }}*
          retention-days: 30

  test-npm-package:
    needs: build-and-package
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            name: Linux x64
          - os: macos-latest
            name: macOS x64
          - os: windows-latest
            name: Windows x64
    runs-on: ${{ matrix.os }}
    name: Test npm package on ${{ matrix.name }}
    
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Download npm package
        uses: actions/download-artifact@v4
        with:
          path: ./download
          pattern: zotero-headless-*

      - name: List downloaded files
        shell: bash
        run: |
          echo "Downloaded files:"
          find ./download -type f -name "*.tgz"

      - name: Install and test (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          TGZ_FILE=$(find ./download -name "zotero-headless-*.tgz" | head -1)
          if [ -z "$TGZ_FILE" ]; then
            echo "Error: No .tgz file found"
            exit 1
          fi
          echo "Installing: $TGZ_FILE"
          npm install -g "$TGZ_FILE"

          echo ""
          echo "=== Testing basic commands ==="

          echo ""
          echo "1. Testing zotero --version..."
          zotero --version || { echo "❌ zotero --version failed"; exit 1; }
          echo "✅ zotero --version passed"

          echo ""
          echo "2. Testing zotero help..."
          zotero help || { echo "❌ zotero help failed"; exit 1; }
          echo "✅ zotero help passed"

          echo ""
          echo "3. Testing zotero config --init..."
          zotero config --init || { echo "❌ zotero config --init failed"; exit 1; }
          echo "✅ zotero config --init passed"

          echo ""
          echo "4. Testing zotero config --show..."
          zotero config --show || { echo "❌ zotero config --show failed"; exit 1; }
          echo "✅ zotero config --show passed"

          echo ""
          echo "5. Testing command aliases..."
          zotero h 2>/dev/null || zotero help >/dev/null
          echo "✅ Help alias works"

          echo ""
          echo "=== All tests passed! ==="

      - name: Install and test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $TGZ_FILE = Get-ChildItem -Path ./download -Recurse -Filter "zotero-headless-*.tgz" | Select-Object -First 1
          if (-not $TGZ_FILE) {
            Write-Error "Error: No .tgz file found"
            exit 1
          }
          Write-Host "Installing: $($TGZ_FILE.FullName)"
          npm install -g $TGZ_FILE.FullName

          Write-Host ""
          Write-Host "=== Testing basic commands ==="

          Write-Host ""
          Write-Host "1. Testing zotero --version..."
          zotero --version
          if ($LASTEXITCODE -ne 0) { throw "zotero --version failed" }
          Write-Host "✅ zotero --version passed"

          Write-Host ""
          Write-Host "2. Testing zotero help..."
          zotero help
          if ($LASTEXITCODE -ne 0) { throw "zotero help failed" }
          Write-Host "✅ zotero help passed"

          Write-Host ""
          Write-Host "3. Testing zotero config --init..."
          zotero config --init
          if ($LASTEXITCODE -ne 0) { throw "zotero config --init failed" }
          Write-Host "✅ zotero config --init passed"

          Write-Host ""
          Write-Host "4. Testing zotero config --show..."
          zotero config --show
          if ($LASTEXITCODE -ne 0) { throw "zotero config --show failed" }
          Write-Host "✅ zotero config --show passed"

          Write-Host ""
          Write-Host "=== All tests passed! ==="
