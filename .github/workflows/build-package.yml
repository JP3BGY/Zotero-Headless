name: Build and Package

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., 1.0.0)'
        required: true
        default: '1.0.0'
  
  push:
    branches: [master, main]
    paths-ignore:
      - '**.md'
      - 'docs/**'

jobs:
  build-and-package:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8.12.0

      - name: Get version
        id: get_version
        run: |
          if [ "${{ github.event.inputs.version }}" != "" ]; then
            echo "VERSION=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "VERSION=$(date +%Y%m%d)-$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          fi

      - name: Install dependencies
        run: pnpm install

      - name: Build project
        run: pnpm build

      - name: Package for distribution
        run: |
          VERSION=${{ steps.get_version.outputs.VERSION }}
          mkdir -p dist-package
          cp -r apps/cli/dist dist-package/
          cp -r packages/*/dist dist-package/ 2>/dev/null || true
          
          # Create cross-platform CLI wrapper (JavaScript)
          cat > dist-package/bin.js << 'EOFJS'
          #!/usr/bin/env node
          import { spawn } from 'child_process';
          import { fileURLToPath } from 'url';
          import { dirname, join } from 'path';
          
          const __dirname = dirname(fileURLToPath(import.meta.url));
          const cliPath = join(__dirname, 'dist', 'index.js');
          
          const child = spawn('node', [cliPath, ...process.argv.slice(2)], {
            stdio: 'inherit',
            shell: false
          });
          
          child.on('exit', (code) => {
            process.exitCode = code;
          });
          EOFJS
          chmod +x dist-package/bin.js
          
          cat > dist-package/package.json << EOF
          {
            "name": "zotero-headless",
            "version": "$VERSION",
            "description": "Zotero Web API sync client",
            "type": "module",
            "bin": "./bin.js",
            "engines": { "node": ">=18.0.0" },
            "dependencies": {
              "axios": "^1.13.5",
              "better-sqlite3": "^11.9.1",
              "commander": "^14.0.3",
              "dotenv": "^17.3.1",
              "drizzle-orm": "^0.30.10",
              "sql.js": "^1.14.0",
              "zod": "^4.3.6"
            }
          }
          EOF
          cd dist-package && tar -czf ../zotero-headless-${VERSION}.tgz . && cd ..

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: zotero-headless-${{ steps.get_version.outputs.VERSION }}
          path: zotero-headless-*.tgz
          retention-days: 30

  build-binaries:
    needs: build-and-package
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: node18-linux-x64
            output: zotero-linux-x64
          - os: ubuntu-latest
            target: node18-linux-arm64
            output: zotero-linux-arm64
          - os: macos-latest
            target: node18-macos-x64
            output: zotero-macos-x64
          - os: macos-latest
            target: node18-macos-arm64
            output: zotero-macos-arm64
          - os: windows-latest
            target: node18-win-x64
            output: zotero-win-x64.exe
    runs-on: ${{ matrix.os }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8.12.0

      - name: Install dependencies
        run: pnpm install

      - name: Build project
        run: pnpm build

      - name: Bundle CLI
        run: |
          cd apps/cli-bundle
          pnpm install
          node bundle.js          

      - name: Build executable
        run: |
          cd apps/cli-bundle/dist
          npx pkg -t ${{ matrix.target }} --output ${{ matrix.output }} zotero.js          

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.output }}
          path: apps/cli-bundle/dist/${{ matrix.output }}*
          retention-days: 30
